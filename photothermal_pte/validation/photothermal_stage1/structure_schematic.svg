<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900">
  <defs>
    <linearGradient id="air" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf7ff"/>
      <stop offset="1" stop-color="#d5efff"/>
    </linearGradient>
    <linearGradient id="si" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4d6b8a"/>
      <stop offset="1" stop-color="#263d56"/>
    </linearGradient>
    <linearGradient id="flake" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f05a67"/>
      <stop offset="0.5" stop-color="#ff9b68"/>
      <stop offset="1" stop-color="#f05a67"/>
    </linearGradient>
    <pattern id="pml" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="12" height="12" fill="#f3eef9"/>
      <rect width="4" height="12" fill="#c7b8df"/>
    </pattern>
    <style>
      .title { font-family: "DejaVu Sans"; font-weight: 700; font-size: 34px; fill: #182433; }
      .panel { font-family: "DejaVu Sans"; font-weight: 700; font-size: 25px; fill: #243447; }
      .label { font-family: "DejaVu Sans"; font-weight: 600; font-size: 20px; fill: #182433; }
      .small { font-family: "DejaVu Sans"; font-size: 17px; fill: #34495e; }
      .tiny { font-family: "DejaVu Sans"; font-size: 15px; fill: #536576; }
      .dim { stroke: #243447; stroke-width: 2; fill: none }
      .guide { stroke: #6c7f91; stroke-width: 1.5; stroke-dasharray: 6 5; }
    </style>
  </defs>

  <rect width="1500" height="900" fill="#ffffff"/>
  <text x="750" y="52" text-anchor="middle" class="title">Photothermal Stage-1 Fixed Validation Structure</text>
  <text x="750" y="82" text-anchor="middle" class="small">Actual repository baseline · λ₀ = 4.0 µm · x-polarized normal incidence</text>

  <!-- Left panel -->
  <rect x="45" y="110" width="790" height="710" rx="18" fill="#fbfdff" stroke="#c9d5df" stroke-width="2"/>
  <text x="75" y="150" class="panel">A. x–z cross section (y = 0)</text>
  <text x="75" y="177" class="tiny">Layer thicknesses are annotated; vertical drawing is not to scale.</text>

  <!-- simulation stack -->
  <rect x="150" y="205" width="570" height="55" fill="url(#pml)" stroke="#7e6a9f"/>
  <text x="435" y="239" text-anchor="middle" class="label">z-PML</text>

  <rect x="150" y="260" width="570" height="170" fill="url(#air)" stroke="#7eb9dd"/>
  <text x="180" y="290" class="label">Air</text>
  <text x="180" y="317" class="small">top span = 2.0 µm</text>

  <!-- source -->
  <line x1="435" y1="282" x2="435" y2="354" stroke="#1464a5" stroke-width="5"/>
  <polygon points="427,342 443,342 435,358" fill="#1464a5"/>
  <text x="455" y="305" class="label" fill="#1464a5">plane-wave source</text>
  <text x="455" y="332" class="small" fill="#1464a5">λ₀ = 4.0 µm, propagation −z</text>
  <line x1="365" y1="348" x2="415" y2="348" stroke="#d9485f" stroke-width="4"/>
  <polygon points="405,340 405,356 420,348" fill="#d9485f"/>
  <text x="300" y="354" class="small" fill="#d9485f">E ∥ x</text>

  <!-- design disk cross-section -->
  <rect x="292.5" y="340" width="285" height="90" fill="#f2c14e" stroke="#bd8b00" stroke-width="2"/>
  <text x="435" y="377" text-anchor="middle" class="label">fixed design disk</text>
  <text x="435" y="405" text-anchor="middle" class="small">n = 4, height = 0.600 µm</text>
  <text x="735" y="391" class="small">air elsewhere</text>

  <!-- TaIrTe4 -->
  <rect x="150" y="430" width="570" height="42" fill="url(#flake)" stroke="#b43b51" stroke-width="2"/>
  <text x="435" y="458" text-anchor="middle" class="label">TaIrTe₄ · 0.100 µm · a=x, b=y, c=z</text>
  <text x="735" y="458" class="small">Qₒₙ(x,y,z)</text>

  <!-- SiO2 -->
  <rect x="150" y="472" width="570" height="70" fill="#a7dcdf" stroke="#4b9ca1" stroke-width="2"/>
  <text x="435" y="515" text-anchor="middle" class="label">SiO₂ spacer · 0.285 µm</text>

  <!-- Si -->
  <rect x="150" y="542" width="570" height="175" fill="url(#si)" stroke="#1e3145" stroke-width="2"/>
  <text x="435" y="618" text-anchor="middle" class="label" fill="#ffffff">Si substrate</text>
  <text x="435" y="650" text-anchor="middle" class="small" fill="#ffffff">actual code thickness = 2.0 µm</text>

  <rect x="150" y="717" width="570" height="55" fill="url(#pml)" stroke="#7e6a9f"/>
  <text x="435" y="751" text-anchor="middle" class="label">z-PML</text>

  <!-- periodic boundaries -->
  <line x1="150" y1="205" x2="150" y2="772" stroke="#8c4fb3" stroke-width="4" stroke-dasharray="10 7"/>
  <line x1="720" y1="205" x2="720" y2="772" stroke="#8c4fb3" stroke-width="4" stroke-dasharray="10 7"/>
  <text x="160" y="199" class="small" fill="#7a3b9d">x/y periodic boundaries</text>

  <!-- dimensions and axes -->
  <line x1="150" y1="798" x2="720" y2="798" class="dim"/>
  <text x="435" y="793" text-anchor="middle" class="label">period = 6.0 µm</text>
  <line x1="760" y1="770" x2="760" y2="710" stroke="#243447" stroke-width="3"/>
  <line x1="760" y1="770" x2="810" y2="770" stroke="#243447" stroke-width="3"/>
  <text x="767" y="704" class="label">z</text>
  <text x="814" y="777" class="label">x</text>
  <line x1="150" y1="430" x2="720" y2="430" class="guide"/>
  <text x="728" y="436" class="tiny">z = 0</text>

  <!-- Right panel -->
  <rect x="860" y="110" width="595" height="710" rx="18" fill="#fbfdff" stroke="#c9d5df" stroke-width="2"/>
  <text x="890" y="150" class="panel">B. Top view of one periodic cell</text>
  <text x="890" y="177" class="tiny">Fixed binary test geometry; no optimizer or mapping was called.</text>

  <!-- top view -->
  <rect x="940" y="230" width="430" height="430" fill="url(#air)" stroke="#8c4fb3" stroke-width="5" stroke-dasharray="12 8"/>
  <circle cx="1155" cy="445" r="107.5" fill="#f2c14e" stroke="#bd8b00" stroke-width="4"/>
  <circle cx="1155" cy="445" r="8" fill="#d9485f"/>
  <line x1="1155" y1="445" x2="1262.5" y2="445" class="dim"/>
  <text x="1208" y="430" text-anchor="middle" class="label">r = 1.5 µm</text>
  <text x="1155" y="485" text-anchor="middle" class="label">design n = 4</text>
  <text x="1155" y="512" text-anchor="middle" class="small">cylindrical disk</text>

  <line x1="940" y1="690" x2="1370" y2="690" class="dim"/>
  <text x="1155" y="686" text-anchor="middle" class="label">6.0 µm</text>
  <line x1="1405" y1="230" x2="1405" y2="660" class="dim"/>
  <text x="1368" y="215" text-anchor="end" class="small">y span = 6.0 µm</text>

  <!-- axes -->
  <line x1="970" y1="625" x2="1040" y2="625" stroke="#243447" stroke-width="3"/>
  <line x1="970" y1="625" x2="970" y2="555" stroke="#243447" stroke-width="3"/>
  <text x="1048" y="632" class="label">x (a)</text>
  <text x="949" y="548" class="label">y (b)</text>

  <!-- legend -->
  <rect x="910" y="725" width="24" height="18" fill="#f2c14e" stroke="#bd8b00"/>
  <text x="945" y="741" class="small">fixed photonic design</text>
  <rect x="1165" y="725" width="24" height="18" fill="url(#flake)" stroke="#b43b51"/>
  <text x="1200" y="741" class="small">TaIrTe₄ sheet below</text>
  <text x="1155" y="785" text-anchor="middle" class="tiny">The full TaIrTe₄ / SiO₂ / Si stack extends beneath the entire periodic cell.</text>

  <text x="750" y="865" text-anchor="middle" class="small">
    Validation geometry only — this is not an optimized inverse-design structure and not yet a validated PTE temperature/current result.
  </text>
</svg>
